name: Release

# Builds & publishes ChadMailer installers for every supported platform when
# a `v*` tag is pushed (or when manually triggered). Linux is built on
# `ubuntu-22.04` (oldest webkit2gtk-4.1-aware Ubuntu), Windows on `windows-latest`
# (MSVC + WebView2 toolchains), macOS on a universal build (`aarch64` + `x86_64`).
#
# Tagging `v1.2.3` => GitHub release "ChadMailer v1.2.3" with every native
# installer attached.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS needs both arches for the universal bundle.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo registry & target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file

      - name: Install JS deps
        run: npm install

      - name: Build & publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tag name & names come from the ref so multiple matrix jobs converge
          # on the same release. tauri-action upserts artefacts to it.
          tagName: ${{ github.ref_name }}
          releaseName: "ChadMailer ${{ github.ref_name }}"
          releaseBody: |
            Native installers for ChadMailer ${{ github.ref_name }}.

            - **Linux** — `.deb` (Debian/Ubuntu), `.rpm` (Fedora/RHEL), `.AppImage` (any glibc-based distro).
            - **Windows** — `.msi` and `-setup.exe` (NSIS). Requires WebView2.
            - **macOS** — universal `.dmg`.

            See the [README](https://github.com/sudofat-oss/ChadMailer#readme) for usage.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
